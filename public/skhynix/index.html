<script>
        const adjustedOffsets = {};
        const reloadOffsetEvent = new Event('x_lotties_reload_container_values');
        function sendReloadOffsetEvent() {
                window.dispatchEvent(reloadOffsetEvent);
        }
        function adjustOffsets() {
                console.log('adjusting animation offsets');
                const adjustment = 320;
                const animations = [...document.getElementsByClassName('jbafes-lotties-animation-wrapper')];
                if (window.visualViewport.width < 992 && Object.keys(adjustedOffsets).length === 0) {
                        console.log('decreasing offsets for small screens');
                        animations.forEach((animation) => {
                                const currentOffset = parseInt(animation.getAttribute('data-la_section_offset') || '300');
                                adjustedOffsets[animation.id] = currentOffset;
                                animation.setAttribute('data-la_section_offset', Math.max(0, currentOffset - adjustment));
                        });
                } else if (window.visualViewport.width >= 992 && Object.keys(adjustedOffsets).length !== 0) {
                        console.log('restoring offsets for large screens');
                        animations.forEach((animation) => {
                                if (adjustedOffsets[animation.id]) {
                                        animation.setAttribute('data-la_section_offset', adjustedOffsets[animation.id]);
                                }
                        });
                        adjustedOffsets = {};
                }
        }
        window.addEventListener('resize', adjustOffsets);
        window.addEventListener('load', adjustOffsets);
</script>
